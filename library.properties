name=ModBee GSM
version=0.1.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=Cellular modems over AT commands, for Arduino and hosts - standard TCP and UDP clients, and nothing waits on the modem.
paragraph=Gives you a GsmClient and a GsmUDP that implement Arduino's own Client and UDP, so ArduinoHttpClient, PubSubClient and anything else already written against them works over cellular with no change. Nothing in the library blocks: opening a socket starts the attempt and returns, so it fits inside an Arduino loop() or a PLC scan cycle. Adding a modem family is a driver table rather than a compile-time #define, and the same source builds for a board or a Linux host. Contains no hardware assumptions at all - power and reset are callbacks your sketch supplies, so any wiring works.
category=Communication
url=https://github.com/mod-bee/modbee-gsm
architectures=esp32,esp8266,samd,mbed,rp2040,stm32
includes=ModBeeGsm.h
