name: CI

on:
  push:
  pull_request:

jobs:
  # The library and the C++ examples must build cleanly with each of the three
  # major host compilers: GCC, Clang (Apple) and MSVC.
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release -j 4

  # A warning is a defect that has not been triggered yet, and a backlog of them
  # is how one hides. This keeps the count at zero.
  warnings:
    name: warnings are errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build -j 4

  # Microcontroller toolchains and generated IEC 61131 function-block code build
  # with exceptions and RTTI off. One `throw` or `dynamic_cast` written on a host
  # would compile everywhere except where it matters.
  no-exceptions:
    name: no exceptions, no RTTI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DGSM_NO_EXCEPTIONS=ON -DCMAKE_CXX_FLAGS="-Werror"
      - run: cmake --build build -j 4

  # The library ships as an Arduino library, so every sketch is compiled with
  # the real toolchain. SAMD is in the matrix because its core compiles at
  # gnu++11: it is the board that catches C++14 or C++17 written on a host.
  arduino:
    name: arduino / ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32
          - arduino:samd:mkrzero
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            - name: arduino:samd
          libraries: |
            - source-path: ./
            - name: ArduinoHttpClient
            - name: PubSubClient
          sketch-paths: |
            - examples/arduino
